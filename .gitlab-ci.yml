build:lscsky50-d:
  stage: build
  tags:
    - lscsky50-d
  only:
    - modular_lines
  script:
    - make clean
    - make
  artifacts:
    paths:
      - ./*.so
      - ./*.a
      - ./*.mod

test:lscsky50-d:
  stage: test
  tags:
    - lscsky50-d
  only:
    - modular_lines
  script:
    - make test
  dependencies:
    - build:lscsky50-d
