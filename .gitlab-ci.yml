build:lscgpu50-d:
  stage: build
  tags:
    - gpudevbox
  script:
    - source /opt/lmod/lmod/init/bash
    - module load cuda/9.1
    - autoreconf --install
    - ./configure --prefix /home/Raymond.Menzel/local/molecular_lines --enable-fortran-bindings --enable-cuda CC=nvcc
    - make


deploy:lscgpu50-d:
  stage: deploy
  tags:
    - gpudevbox
  script:
    - make install
  dependencies:
    - build:lscgpu50-d



build:lscsky50-d:
  stage: build
  tags:
    - skylake
  only:
    - molecular_lines_beta
  script:
    - make clean
    - make
  artifacts:
    paths:
      - ./*.so
      - ./*.a
      - ./*.mod
      - ./*.o

test:lscsky50-d:
  stage: test
  tags:
    - skylake
  only:
    - molecular_lines_beta
  script:
    - make test
  dependencies:
    - build:lscsky50-d
